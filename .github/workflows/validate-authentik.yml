name: Validate Authentik add-on

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Validate repository structure and version alignment
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate startup script syntax
        run: bash -n authentik/run.sh
      - name: Build Authentik add-on (amd64)
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*VERSION: "\([^"]*\)".*/\1/p' authentik/build.yaml)"
          [[ "$version" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]
          docker build --pull \
            --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-debian:trixie \
            --build-arg VERSION="$version" \
            -f authentik/Dockerfile \
            -t authentik-addon-ci authentik
